<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceTech - Login</title>
    <!-- Fonte Inter do Google para ficar idêntico à imagem -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            color: #ffc700; /* Título Amarelo */
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #64748b;
            font-size: 0.95rem;
            margin: 0;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .campo input {
            width: 100%;
            background-color: #f1f5f9; /* Fundo azul bem clarinho da imagem */
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
        }

        .campo input:focus {
            border-color: #ffc700;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 199, 0, 0.2);
        }

        .campo input::placeholder {
            color: #000000;
            font-weight: 400;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #ffc700; /* Botão Amarelo */
            color: #000000; /* Texto preto para dar contraste no amarelo */
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background-color: #eab308; /* Amarelo um pouco mais escuro ao passar o mouse */
        }

        .cadastro {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #64748b;
        }

        .cadastro a {
            color: #d97706; /* Amarelo escuro no link para facilitar a leitura */
            font-weight: 700;
            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">
            <h1>FinanceTech</h1>
            <p>Controle suas finanças de forma simples.</p>
        </div>

        <form method="POST" action="/login">

            <div class="campo">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Usuario" 
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="" 
                    required
                >
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="cadastro">
            Ainda não possui uma conta? 
            <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
        </p>
        
    </main>

</body>
</html>
