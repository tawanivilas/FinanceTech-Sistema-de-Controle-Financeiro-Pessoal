<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinanceTech - Controle Financeiro{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8fafc;
            --sidebar-bg: #ffc700;
            --sidebar-text: #0f172a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* SIDEBAR ESTILO FINANCETECH */
        .sidebar-wrapper {
            background-color: var(--sidebar-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            z-index: 1000;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 8px;
            margin-bottom: 32px;
        }

        .brand-icon {
            background: #000000;
            color: var(--sidebar-bg);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: #000000;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.75rem;
            margin: 0;
            color: #333333;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-nav .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #000000;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .sidebar-nav .nav-link.active {
            background-color: #000000;
            color: #ffffff;
        }

        .sidebar-nav .nav-link:hover:not(.active) {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .logout-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #000000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .logout-link:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        /* CONTEÚDO PRINCIPAL */
        .main-wrapper {
            margin-left: 240px;
            padding: 32px;
            min-height: 100vh;
        }

        /* RESPONSIVIDADE PARA TELAS MENORES */
        @media (max-width: 991.98px) {
            .sidebar-wrapper {
                position: relative;
                width: 100%;
                min-height: auto;
            }
            .main-wrapper {
                margin-left: 0;
                padding: 16px;
            }
        }
    </style>

    {% block styles %}{% endblock %}
</head>
<body>

    <!-- BARRA LATERAL / SIDEBAR -->
    <aside class="sidebar-wrapper">
        <div>
            <div class="brand-section">
                <div class="brand-icon">
                    <i class="fa-solid fa-chart-simple"></i>
                </div>
                <div class="brand-text">
                    <h1>FinanceTech</h1>
                    <p>Controle Financeiro</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Correção: Links diretos limpos e funcionais -->
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i> Visão geral
                </a>
                <a href="{{ url_for('lancamentos') }}" class="nav-link {% if request.endpoint == 'lancamentos' %}active{% endif %}">
                    <i class="fa-solid fa-receipt"></i> Lançamentos
                </a>
                <a href="{{ url_for('metas') }}" class="nav-link {% if request.endpoint == 'metas' %}active{% endif %}">
                    <i class="fa-solid fa-bullseye"></i> Metas
                </a>
            </nav>
        </div>

        <div>
            <!-- Correção: Link de logout funcional -->
            <a href="{{ url_for('logout') }}" class="logout-link">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
            </a>
        </div>
    </aside>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
