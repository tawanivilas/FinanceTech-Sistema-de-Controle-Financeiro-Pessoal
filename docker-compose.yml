services:
  mysql:
    image: mysql:8.0
    container_name: financetech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financetech
      MYSQL_USER: financetech
      MYSQL_PASSWORD: financetech123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: